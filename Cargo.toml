[workspace]
resolver = "2"
members = [
    "lntrn-render/draw",
    "lntrn-render/gfx",
    "lntrn-text",
    "lntrn-compositor",
    "lntrn-ui",
    "lntrn-render",
    "lntrn-file-manager",
    "lntrn-desktop",
    "lntrn-terminal",
    "lntrn-image-viewer",
    "lntrn-media-player",
    "lntrn-screenshot",
    "lntrn-session-manager",
    "lntrn-system-settings",
    "lntrn-theme",
    "lntrn-osd",
    "lntrn-notifyd",
    "lntrn-notepad",
    "lntrn-code",
    "lntrn-snapshot",
    "lntrn-portal",
    "lntrn-git",
    "lntrn-calculator",
    "lntrn-dbus",
    "lntrn-sysmon",
    "lntrn-icons",
    "lntrn-screencopy",
    "lntrn-command-center",
    "lntrn-keychain",
    "lntrn-keys",
    "lntrn-rice",
    "lntrn-lockscreen",
    "lntrn-afterglow",
]

[profile.release]
opt-level = 2
strip = true
incremental = false

# Vendored Smithay 0.7 with a one-line guard against a divide-by-zero panic in
# the integer coordinate math (utils/geometry.rs). Triggered by Steam's
# degenerate X11/CEF surfaces once the XWayland client_scale drops below 1.0
# (our native-resolution-for-games fix). See vendor/smithay for the patch.
[patch.crates-io]
smithay = { path = "vendor/smithay" }
