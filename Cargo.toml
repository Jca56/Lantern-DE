[workspace]
resolver = "2"
members = [
    "lntrn-render/draw",
    "lntrn-render/gfx",
    "lntrn-ui/test",
    "lntrn-render/text",
    "lntrn-compositor",
    "lntrn-ui",
    "lntrn-render",
    "lntrn-file-manager",
    "lntrn-desktop",
    "lntrn-bar",
    "lntrn-terminal",
    "lntrn-image-viewer",
    "lntrn-media-player",
    "lntrn-screenshot",
    "lntrn-session-manager",
    "lntrn-system-settings",
    "lntrn-theme",
    "lntrn-osd",
    "lntrn-notifyd",
    "lntrn-menu",
    "lntrn-notepad",
    "lntrn-code",
    "lntrn-snapshot",
    "lntrn-portal",
    "lntrn-git",
    "lntrn-calculator",
    "lntrn-dbus",
    "lntrn-app-template",
    "lntrn-sysmon",
    "lntrn-icons",
    "lntrn-screencopy",
    "lntrn-lava-lamp",
    "lntrn-command-center",
    "lntrn-gear",
    "lntrn-gear-ui",
    "lntrn-keychain",
    "lntrn-keys",
    "lntrn-clock",
    "lntrn-rice",
    "lntrn-lockscreen",
    "lntrn-spotify-theme",
]

# Custom text engine in development — built standalone so it stays off the live
# DE build until it's finished (see lntrn-type/PLAN.md). Renamed to lntrn-text
# and added to `members` at the end of the project.
exclude = ["lntrn-type"]

[profile.release]
opt-level = 2
strip = true
incremental = false

# Vendored Smithay 0.7 with a one-line guard against a divide-by-zero panic in
# the integer coordinate math (utils/geometry.rs). Triggered by Steam's
# degenerate X11/CEF surfaces once the XWayland client_scale drops below 1.0
# (our native-resolution-for-games fix). See vendor/smithay for the patch.
[patch.crates-io]
smithay = { path = "vendor/smithay" }
