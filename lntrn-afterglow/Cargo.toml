[package]
name = "lntrn-afterglow"
version = "0.2.0"
description = "Lantern DE - Afterglow: tune the graphics card and the processor, on Lantern UI 2"
authors = ["Alva"]
edition = "2024"

[[bin]]
name = "lntrn-afterglow"
path = "src/main.rs"

[dependencies]
lntrn-afterglowd = { path = "daemon" }
lntrn-app = { path = "../../lantern-ui-2/crates/lntrn-app" }
lntrn-ui = { path = "../../lantern-ui-2/crates/lntrn-ui" }
lntrn-core = { path = "../../lantern-ui-2/crates/lntrn-core" }
lntrn-math = { path = "../../lantern-ui-2/crates/lntrn-math" }
lntrn-data = { path = "../../lantern-ui-2/crates/lntrn-data" }
lntrn-sys = { path = "../../lantern-ui-2/crates/lntrn-sys" }
lntrn-kit = { path = "../lntrn-kit" }
