[package]
name = "lntrn-command-center"
version = "0.1.0"
description = "Command Center for Lantern DE — drop-down launcher + system controls"
authors = ["Jca56"]
edition = "2021"

[dependencies]
anyhow = "1"
chrono = "0.4"
libc = "0.2"
lntrn-dbus = { path = "../lntrn-dbus" }
lntrn-icons = { path = "../lntrn-icons" }
lntrn-render = { path = "../lntrn-render" }
lntrn-terminal = { path = "../lntrn-terminal" }
lntrn-ui = { path = "../lntrn-ui" }
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
raw-window-handle = "0.6"
resvg = "0.45"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wgpu = "28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
