[package]
name = "lntrn-compositor"
version = "0.1.0"
description = "Wayland compositor for Lantern DE"
authors = ["Jca56"]
edition = "2021"

[[bin]]
name = "lntrn-compositor"
path = "src/main.rs"

[dependencies]
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    "xwayland",
] }
smithay-drm-extras = { version = "0.1", default-features = false, features = [
    "display-info",
] }
# Direct dep with the v0_2 feature so we get the HDR static-metadata /
# colorimetry accessors (`hdr_static_metadata`, `default_color_primaries`,
# `supported_signal_colorimetry`) — those are gated behind `v0_2`, which
# smithay-drm-extras does NOT enable on its own. Cargo unifies the feature
# across both. Links the system `libdisplay-info` C library.
libdisplay-info = { version = "0.2.1", features = ["v0_2"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bitflags = "2"
xcursor = "0.3"
# Already in-tree via smithay's xwayland feature; direct dep adds `render`
# for ARGB32 root-cursor creation (src/x11_resources.rs).
x11rb = { version = "0.13", default-features = false, features = ["render"] }
libc = "0.2"
lntrn-icons = { path = "../lntrn-icons" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Direct dep purely to enable `libwayland_server_1_23`: it gates
# `Handle::set_default_max_buffer_size` even on the pure-Rust backend
# (upstream cfg quirk). With the rs backend it's a plain cfg flag — no
# libwayland linkage. Growable client send buffers replace the fixed 4 KiB
# buffer that silently killed clients during event bursts.
wayland-backend = { version = "0.3.17", features = ["libwayland_server_1_23"] }
wayland-protocols = { version = "0.32", features = ["server", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
resvg = "0.47"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
