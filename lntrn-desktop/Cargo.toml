[package]
name = "lntrn-desktop"
version = "0.2.0"
description = "Lantern Desktop — icons on the desktop, like a sane DE"
authors = ["Jca56"]
edition = "2021"

[[bin]]
name = "lntrn-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
lntrn-render = { path = "../lntrn-render" }
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
resvg = "0.47"
nix = { version = "0.29", features = ["fs", "poll", "inotify"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xkbcommon = "0.9"
pipewire = "0.9"
libspa = "0.9"
