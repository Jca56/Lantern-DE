[package]
name = "lntrn-text"
version = "0.1.0"
description = "Text rendering and layout for Lantern DE"
authors = ["Jca56"]
edition = "2021"

[dependencies]
glyphon = "0.10"
# Same version cosmic-text uses — needed only to name `Script` in the
# `Fallback` trait signature for our custom font fallback ordering.
unicode-script = "0.5"
lntrn-draw = { path = "../draw" }
lntrn-gfx = { path = "../gfx" }
lntrn-theme = { path = "../../lntrn-theme" }
wgpu = "28"